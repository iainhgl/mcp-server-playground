[project]
name = "identity"
version = "0.1.0"
description = "AgentCore-Identity-shaped service: workload identity, token vault, 3LO orchestration (SPEC §6.3)"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "playground-common",
    "psycopg[binary,pool]==3.3.9",
    "psycopg-pool==3.3.3",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
playground-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
