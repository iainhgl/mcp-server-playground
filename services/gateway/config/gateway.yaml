# Gateway config. Shapes mirror AgentCore Gateway (SPEC §6.2, §11).

# The resource identifier: it goes in PRM, and tokens' `aud` must contain it.
resource: https://gateway.localtest.me/mcp
required_scopes: [mcp:tools]

# ≈ AgentCore customJWTAuthorizer. A list, so a second IdP (SPEC §12) is a config change.
authorizers:
  - name: rhsso
    discoveryUrl: https://idp.localtest.me/realms/playground/.well-known/openid-configuration
    allowedAudience: [https://gateway.localtest.me/mcp]
    # DCR gives every MCP client a random client_id, so the allowlist can't be static.
    # Tighten later with a pattern, or by pre-registering clients (as Entra will require).
    allowedClients: ["*"]

# Optional RFC 7662 introspection of every inbound T1, cached per token (S17: catches disabled users and
# revoked sessions before `exp`). Env GATEWAY_INTROSPECT=true|false overrides it.
introspection: { enabled: false, cacheSeconds: 30 }

# ≈ AgentCore Identity, which AgentCore Gateway calls internally. Here the gateway calls it over HTTPS
# with its own service token (gateway-svc, T7 ≈ IAM role). The secret comes from env GATEWAY_SVC_CLIENT_SECRET.
identity:
  url: https://identity.localtest.me/identities
  workloadName: gateway
  serviceClientId: gateway-svc
  returnUrl: https://portal.localtest.me/oauth/return

# How "consent needed" reaches the user: auto | tool_error | url_elicitation (SPEC §6.2).
# Env GATEWAY_CONSENT_SIGNAL overrides it.
consentSignal: auto

# ≈ AgentCore Gateway targets: tool names are <target>___<tool>.
targets:
  - name: jira
    baseUrl: https://jira.localtest.me
    credentialProvider: { name: jira-dc, type: oauth2, flow: USER_FEDERATION }
