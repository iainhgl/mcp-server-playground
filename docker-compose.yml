# MCP OAuth playground. See SPEC.md §2 (topology) and §6.6 (infra).
# Phase 0: TLS edge (Caddy), IdP (Keycloak as RH SSO), Postgres, OpenBao, mitmproxy.
# Phase 1: gateway (MCP server, JWT authorizer, PRM).
# Phase 2: jira (Atlassian DC stub: OAuth 2.0 provider + REST v2 subset).
# Phase 3: identity (+ identity-init): workload identity, token vault, 3LO, session binding.

name: mcp-playground

x-bootstrap: &bootstrap
  image: ghcr.io/astral-sh/uv:0.13.8-python3.12-trixie-slim
  restart: "no"
  networks: [mesh]
  volumes:
    - uv-cache:/root/.cache/uv

services:
  caddy:
    image: caddy:2.11.8-alpine
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      # The internal CA root exists once Caddy has issued its first site cert.
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      retries: 30
    networks:
      mesh:
        # Containers resolve every public hostname to the TLS edge, so URLs
        # (issuer, redirect_uri, audience) are identical inside and outside Docker.
        aliases:
          - idp.localtest.me
          - gateway.localtest.me
          - identity.localtest.me
          - portal.localtest.me
          - jira.localtest.me
          - confluence.localtest.me

  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      PG_KEYCLOAK_PASSWORD: ${PG_KEYCLOAK_PASSWORD}
      PG_IDENTITY_PASSWORD: ${PG_IDENTITY_PASSWORD}
      PG_PORTAL_PASSWORD: ${PG_PORTAL_PASSWORD}
    volumes:
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
    networks: [mesh]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${PG_KEYCLOAK_PASSWORD}
      KC_HOSTNAME: https://idp.localtest.me
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"            # TLS terminates at Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      start_period: 120s
      retries: 30
    networks: [mesh]

  keycloak-init:
    <<: *bootstrap
    command: ["uv", "run", "--script", "/bootstrap/bootstrap.py"]
    environment:
      KC_URL: http://keycloak:8080
      KC_ADMIN_USER: ${KC_ADMIN_USER}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET}
      PORTAL_SVC_CLIENT_SECRET: ${PORTAL_SVC_CLIENT_SECRET}
      GATEWAY_SVC_CLIENT_SECRET: ${GATEWAY_SVC_CLIENT_SECRET}
    volumes:
      - uv-cache:/root/.cache/uv
      - ./infra/keycloak:/bootstrap:ro
    depends_on:
      keycloak: { condition: service_healthy }

  openbao:
    image: openbao/openbao:2.7.1
    command: ["server"]
    volumes:
      - ./infra/openbao/config.hcl:/openbao/config/config.hcl:ro
      - bao-data:/openbao/file
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      # 200 even when sealed/uninitialised: we only want "process is serving".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200"]
      interval: 2s
      retries: 30
    networks: [mesh]

  openbao-init:
    <<: *bootstrap
    command: ["uv", "run", "--script", "/bootstrap/bootstrap.py"]
    environment:
      BAO_ADDR: http://openbao:8200
      SECRETS_FILE: /secrets/openbao-init.json
    volumes:
      - uv-cache:/root/.cache/uv
      - ./infra/openbao:/bootstrap:ro
      - ./.secrets:/secrets
    depends_on:
      openbao: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      # Outbound (JWKS/discovery) goes via mitmproxy → Caddy. Trust both CAs explicitly.
      CA_FILES: /caddy-data/caddy/pki/authorities/local/root.crt:/mitm/mitmproxy-ca-cert.pem
      HTTPS_PROXY: http://mitmproxy:8080
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - caddy-data:/caddy-data:ro
      - ./certs/mitmproxy:/mitm:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      retries: 20
    depends_on:
      caddy: { condition: service_healthy }
      mitmproxy: { condition: service_started }
    networks: [mesh]

  identity:
    # ≈ AgentCore Identity (SPEC §6.3): workload identity, token vault, 3LO orchestration.
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      PUBLIC_URL: https://identity.localtest.me
      DATABASE_URL: postgresql://identity:${PG_IDENTITY_PASSWORD}@postgres:5432/identity
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /secrets/token
      IDENTITY_ADMIN_TOKEN: ${IDENTITY_ADMIN_TOKEN}
      IDENTITY_WAT_KEY: ${IDENTITY_WAT_KEY}
      IDP_DISCOVERY_URL: https://idp.localtest.me/realms/playground/.well-known/openid-configuration
      # Outbound HTTPS (IdP JWKS, Jira token endpoint) goes via mitmproxy. OpenBao is reached directly.
      CA_FILES: /caddy-data/caddy/pki/authorities/local/root.crt:/mitm/mitmproxy-ca-cert.pem
      HTTPS_PROXY: http://mitmproxy:8080
      NO_PROXY: localhost,127.0.0.1,openbao,postgres
    volumes:
      - caddy-data:/caddy-data:ro
      - ./certs/mitmproxy:/mitm:ro
      - ./.secrets/identity:/secrets:ro   # only identity's own OpenBao token, never the root token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 3s
      retries: 20
    depends_on:
      postgres: { condition: service_healthy }
      openbao-init: { condition: service_completed_successfully }
      caddy: { condition: service_healthy }
    networks: [mesh]

  identity-init:
    <<: *bootstrap
    command: ["uv", "run", "--script", "/bootstrap/bootstrap.py"]
    environment:
      IDENTITY_URL: http://identity:8001
      IDENTITY_ADMIN_TOKEN: ${IDENTITY_ADMIN_TOKEN}
      JIRA_OAUTH_CLIENT_ID: ${JIRA_OAUTH_CLIENT_ID}
      JIRA_OAUTH_CLIENT_SECRET: ${JIRA_OAUTH_CLIENT_SECRET}
    volumes:
      - uv-cache:/root/.cache/uv
      - ./infra/identity:/bootstrap:ro
    depends_on:
      identity: { condition: service_healthy }

  jira:
    # Jira DC stub (SPEC §6.5). Persona "jira". The Confluence persona arrives in phase 6.
    build:
      context: .
      dockerfile: services/atlassian-stub/Dockerfile
    environment:
      PERSONA: jira
      PORT: "2990"
      BASE_URL: https://jira.localtest.me
      STUB_DB: /data/stub.db
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      STUB_ADMIN_TOKEN: ${STUB_ADMIN_TOKEN}
      # The incoming application link a Jira admin would create (SPEC §6.5).
      OAUTH_CLIENT_ID: ${JIRA_OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${JIRA_OAUTH_CLIENT_SECRET}
      OAUTH_CLIENT_NAME: MCP Gateway (playground)
      OAUTH_REDIRECT_URI: https://identity.localtest.me/identities/oauth2/callback
      OAUTH_SCOPE: WRITE
    volumes:
      - jira-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2990/healthz')"]
      interval: 3s
      retries: 20
    networks: [mesh]

  mitmproxy:
    image: mitmproxy/mitmproxy:12.3.0
    command:
      - mitmweb
      - --web-host=0.0.0.0
      - --web-port=8081
      - --listen-port=8080
      - --set=web_password=${MITM_WEB_PASSWORD}
      # Upstream is always Caddy; trust its internal CA rather than disabling verification.
      - --set=ssl_verify_upstream_trusted_ca=/caddy-data/caddy/pki/authorities/local/root.crt
    volumes:
      - ./certs/mitmproxy:/home/mitmproxy/.mitmproxy
      - caddy-data:/caddy-data:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      caddy: { condition: service_healthy }
    networks: [mesh]

networks:
  mesh: {}

volumes:
  caddy-data: {}
  pg-data: {}
  bao-data: {}
  uv-cache: {}
  jira-data: {}
