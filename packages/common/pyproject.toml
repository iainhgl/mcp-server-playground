[project]
name = "playground-common"
version = "0.1.0"
description = "Shared JWT validation, token ledger and HTTP client setup (SPEC §6)"
requires-python = ">=3.12"
dependencies = [
    "httpx2==2.16.2",
    "psycopg[binary]==3.3.9",
    "pyjwt[crypto]==2.15.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
